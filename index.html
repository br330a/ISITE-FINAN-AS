<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISITE</title>
    <link rel="stylesheet" href="./src/css/style.css">
    
</head>


<body>
    <button id="logout" class="btnLogout">
        Sair
    </button>
    
    <div class="C1">
        <div class="header">
            <h2 class="titulo">ISITE FINANÇAS</h2>
            <p id="data-atual"></p>
        </div>

        <div class="resumo">
            <div class="card-Entrada">
                <h3>Entrada</h3>
                <p id="entrada">R$ 0,00</p>
            </div>

            <div class="card-Saldo">
                <h3>Saldo</h3>
                <p id="saldo">R$ 0,00</p>
            </div>

            <div class="card-Saida">
                <h3>Saída</h3>
                <p id="saida">R$ 0,00</p>
            </div>
        </div>
    </div>

    <div class="C2">
        <div class="header2">
            <h4 class="NT">Nova Transação</h4>
        </div>

        <div class="inputs">
            <div class="Desc">
                <p>Descrição: </p>
                <input type="text" id="descricao" placeholder="Descrição">
            </div>
            
            <div class="Vlr">
                <p>Valor:</p>
                <div class="inputV">
                    <span class="prefix">R$</span>
                    <input type="number" id="valor" placeholder="Valor">
                </div>
                
                <p>Tipo:</p>
                <select id="tipo">
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            
            <div class="Cat">

                <p>Categoria:</p>
                <select id="categoria">
                    <option value="alimentacao">Alimentação</option>
                    <option value="lazer">Lazer</option>
                    <option value="namorada">Namorada</option>
                    <option value="transporte">Transporte</option>
                    <option value="estudos">Estudos</option>
                </select>

                <p>Data: </p>
                <input type="date" id="data">
            </div>

        </div>

        <div class="buttonPart">

            <div class="icon">
                <a href="./src/pages/dashboard.html">
                    <button id="botaoDash" > 
                        <img class="iconDash" src="./src/assets/icons/graph.png">
                    </button>
                </a>
            </div>

            <div class="botao">
                <button id="adicionar">Adicionar</button>
            </div>

            <div class="icon">
                <a href="./src/pages/historico.html">
                    <button id="botaoTabela" > 
                        <img class="iconTabela" src="./src/assets/icons/iconTabela.webp">
                    </button>
                </a>
            </div>

        </div>
        
    </div>
    
    <div id="modalConfirmacao" class="modalConfirmacao">

        <div class="modalBox">

            <h2>Confirmar saída</h2>

            <p>Deseja realmente sair da sua conta?</p>

            <div class="modalBotoes">

                <button id="cancelarLogout" class="btnCancelar">
                    Cancelar
                </button>

                <button id="confirmarLogout" class="btnConfirmar">
                    Sair
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="./src/js/script.js"></script>

</body>
</html>
