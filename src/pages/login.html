<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ISITE Finanças</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login">

        <section class="login__container">

            <div class="login__header">

                <h1>ISITE Finanças</h1>

                <p>
                    Faça login para acessar sua conta.
                </p>

            </div>

            <form id="form-login">

                <div class="campo">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu email"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button type="submit">

                    Entrar

                </button>

            </form>

            <p class="cadastro">

                Não possui uma conta?

                <a href="#">

                    Criar conta

                </a>

            </p>

        </section>

    </main>
    <script type="module" src="../js/login.js"></script>
</body>

</html>
