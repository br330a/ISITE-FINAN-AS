<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | ISITE Finanças</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="login">

        <section class="login__container">

            <div class="login__header">

                <h1>ISITE Finanças</h1>

                <p>
                    Crie sua conta.
                </p>

            </div>

            <form id="form-login">

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu email"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senhaContainer">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <i
                            id="toggleSenha"
                            class="fa-solid fa-eye"
                        ></i>

                    </div>

                </div>

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="senhaContainer">

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Confirme sua senha"
                            required
                        >

                        <i
                            id="toggleConfirmarSenha"
                            class="fa-solid fa-eye"
                        ></i>

                    </div>

                </div>

                <button type="submit">

                    Cadastrar

                </button>

                <p id="mensagemErro" class="mensagemErro"></p>

            </form>

            <p class="cadastro">

                Já possui uma conta?

                <a href="./login.html">

                    Login

                </a>

            </p>

        </section>

    </main>
    <script type="module" src="../js/cadastro.js"></script>
</body>

</html>
