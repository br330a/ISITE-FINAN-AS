<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link rel="stylesheet" href="../css/historico.css">
    <link rel="stylesheet" href="../css/toast.css">
</head>
<body>
    <div class="C1">

        <div class="header">
            <a href="../../index.html" class="botaoVoltar">
                <img class="btnVoltar" src="../assets/icons/seta.png">
            </a>
            <h2 class="titulo">HISTÓRICO</h2>
        </div>


        <div class="historico"> 
            <div class="slidebar">
                <div class="headerFiltros">

                    <h3>Filtros</h3>

                    <button
                        id="btnLimparFiltros"
                        class="btnLimparFiltros"
                    >

                        🧹 Limpar

                    </button>

                </div>

                <div class="filtroGrupo">
                    <label>Tipo</label>
                    <select id="filtroTipo">
                        <option value="todos">Todos</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>

                <div class="filtroGrupo">
                    <label>Categoria</label>
                    
                    <select id="filtroCategoria">
                        <option value="todos">Todas</option>
                        

                    </select>
                </div>

                <div class="filtroGrupo">
                    <label>Data Inicial</label>

                    <input type="date" id="dataInicial">
                </div>

                <div class="filtroGrupo">
                    <label>Data Final</label>

                    <input type="date" id="dataFinal">
                </div>
            </div>
        

            <div class="tabelaArena">
                <div class="pesquisa">
                    <img src="../assets/icons/lupa.png" class="LUPA">
                    <input 
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar descrição..."
                    >
                </div>
                
                <div class="tabelaScroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th>Tipo</th>
                                <th>Categoria</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="historico-body">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <div id="modalExcluir" class="modalConfirmacao">

        <div class="modalBox">

            <h2 id="tituloModal">
                Excluir transação
            </h2>

            <p id="textoModal">
                Deseja realmente excluir esta transação?
            </p>

            <div class="modalBotoes">

                <button id="cancelarExcluir" class="btnCancelar">
                    Cancelar
                </button>

                <button id="confirmarExcluir" class="btnConfirmar">
                    Excluir
                </button>

            </div>

        </div>

    </div>

    <div id="modalEditar" class="modalConfirmacao">

        <div class="modalEditarBox">

            <h2>✏️ Editar Transação</h2>

            <div class="campo">

                <label for="editarDescricao">
                    Descrição
                </label>

                <input
                    type="text"
                    id="editarDescricao"
                >

            </div>

            <div class="campo">

                <label for="editarValor">
                    Valor
                </label>

                <input
                    type="number"
                    id="editarValor"
                >

            </div>

            <div class="campoLinha">

                <div class="campo">

                    <label for="editarTipo">
                        Tipo
                    </label>

                    <select id="editarTipo">

                        <option value="entrada">
                            Entrada
                        </option>

                        <option value="saida">
                            Saída
                        </option>

                    </select>

                </div>

                <div class="campo">

                    <label for="editarCategoria">
                        Categoria
                    </label>

                    <select id="editarCategoria">

                        <option value="todos">Todas</option>

                        <option value="alimentacao">🍔 Alimentação</option>
                        <option value="transporte">🚗 Transporte</option>
                        <option value="moradia">🏠 Moradia</option>
                        <option value="contas">💡 Contas</option>
                        <option value="mercado">🛒 Mercado</option>
                        <option value="estudos">🎓 Estudos</option>
                        <option value="trabalho">💼 Trabalho</option>
                        <option value="saude">💊 Saúde</option>
                        <option value="academia">🏋️ Academia</option>
                        <option value="lazer">🎮 Lazer</option>
                        <option value="assinaturas">🎬 Assinaturas</option>
                        <option value="compras">🛍️ Compras</option>
                        <option value="roupas">👕 Roupas</option>
                        <option value="pets">🐶 Pets</option>
                        <option value="viagem">✈️ Viagem</option>
                        <option value="presentes">🎁 Presentes</option>
                        <option value="namorada">❤️ Namorada</option>
                        <option value="investimentos">💰 Investimentos</option>
                        <option value="salario">💵 Salário</option>
                        <option value="renda_extra">📈 Renda Extra</option>
                        <option value="outros">📦 Outros</option>

                    </select>

                </div>

            </div>

            <div class="campo">

                <label for="editarData">
                    Data
                </label>

                <input
                    type="date"
                    id="editarData"
                >

            </div>

            <div class="modalBotoes">

                <button
                    id="cancelarEditar"
                    class="btnCancelar"
                >
                    Cancelar
                </button>

                <button
                    id="salvarEditar"
                    class="btnConfirmar"
                >
                    Salvar Alterações
                </button>

            </div>

        </div>

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <script type="module" src="../js/historico.js"></script>
</body>
</html>
