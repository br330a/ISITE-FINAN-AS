<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link rel="stylesheet" href="../css/historico.css">
</head>
<body>
    <div class="C1">

        <div class="header">
            <a href="../../index.html" class="botaoVoltar">
                <img class="btnVoltar" src="../assets/icons/seta.png">
            </a>
            <h2 class="titulo">HISTÓRICO</h2>
        </div>


        <div class="historico"> 
            <div class="slidebar">
                <h3>Filtros</h3>

                <div class="filtroGrupo">
                    <label>Tipo</label>
                    <select id="filtroTipo">
                        <option value="todos">Todos</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>

                <div class="filtroGrupo">
                    <label>Categoria</label>
                    
                    <select id="filtroCategoria">
                        <option value="todos">Todas</option>
                        <option value="alimentacao">Alimentação</option>
                        <option value="lazer">Lazer</option>
                        <option value="namorada">Namorada</option>
                        <option value="transporte">Transporte</option>
                        <option value="estudos">Estudos</option>

                    </select>
                </div>

                <div class="filtroGrupo">
                    <label>Data Inicial</label>

                    <input type="date" id="dataInicial">
                </div>

                <div class="filtroGrupo">
                    <label>Data Final</label>

                    <input type="date" id="dataFinal">
                </div>
            </div>
        

            <div class="tabelaArena">
                <div class="pesquisa">
                    <img src="../assets/icons/lupa.png" class="LUPA">
                    <input 
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar descrição..."
                    >
                </div>
            
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="historico-body">

                    </tbody>
                    
                </table>
            </div>
        </div>

    <script src="../js/historico.js"></script>
</body>
</html>
